<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" role="img" aria-label="How the regression model is trained and tested"><title>How the regression model is trained and tested</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--d-mute,#63635e)"/></marker></defs><rect x="8" y="45" width="120" height="60" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="68.0" y="72.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Analytics table</text><text x="68.0" y="89.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">61,737 rows</text><rect x="168" y="10" width="140" height="52" rx="8" style="fill:var(--d-tint,#eaf0fd);stroke:var(--d-acc,#2f5bd3);stroke-width:1.4"/><text x="238.0" y="33.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Train: 2022-24</text><text x="238.0" y="50.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">45,266 rows</text><rect x="168" y="90" width="140" height="52" rx="8" style="fill:var(--d-tint3,#fbeae4);stroke:var(--d-warm,#c2542d);stroke-width:1.4"/><text x="238.0" y="113.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Test: 2025</text><text x="238.0" y="130.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">15,919 rows</text><rect x="348" y="10" width="140" height="52" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="418.0" y="33.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Fit the line</text><text x="418.0" y="50.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">LinearRegression</text><rect x="348" y="90" width="140" height="52" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="418.0" y="120.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Predict 2025</text><rect x="540" y="45" width="170" height="60" rx="8" style="fill:var(--d-tint2,#e6f4ec);stroke:var(--d-acc2,#1f8a5b);stroke-width:1.4"/><text x="625.0" y="72.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Score</text><text x="625.0" y="89.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">MAE 2.45  ·  R² 0.12</text><line x1="128.0" y1="61.2" x2="168.0" y2="52.1" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="128.0" y1="89.5" x2="168.0" y2="99.1" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="308.0" y1="36.0" x2="348.0" y2="36.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="418.0" y1="62.0" x2="418.0" y2="90.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="308.0" y1="116.0" x2="348.0" y2="116.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="488.0" y1="102.1" x2="540.0" y2="91.8" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/></svg>