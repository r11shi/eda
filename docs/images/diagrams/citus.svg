<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-label="Citus: one coordinator and two workers"><title>Citus: one coordinator and two workers</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--d-mute,#63635e)"/></marker></defs><rect x="270" y="6" width="180" height="40" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="360.0" y="30.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Your SQL query</text><rect x="230" y="70" width="260" height="56" rx="8" style="fill:var(--d-tint,#eaf0fd);stroke:var(--d-acc,#2f5bd3);stroke-width:1.4"/><text x="360.0" y="95.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Coordinator (port 5440)</text><text x="360.0" y="112.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">splits the query, merges the answers</text><rect x="40" y="160" width="280" height="60" rx="8" style="fill:var(--d-tint2,#e6f4ec);stroke:var(--d-acc2,#1f8a5b);stroke-width:1.4"/><text x="180.0" y="187.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Worker 1 (port 5441)</text><text x="180.0" y="204.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">16 shards of the fact table + all dimensions</text><rect x="400" y="160" width="280" height="60" rx="8" style="fill:var(--d-tint2,#e6f4ec);stroke:var(--d-acc2,#1f8a5b);stroke-width:1.4"/><text x="540.0" y="187.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Worker 2 (port 5442)</text><text x="540.0" y="204.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">16 shards of the fact table + all dimensions</text><line x1="360.0" y1="46.0" x2="360.0" y2="70.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="305.2" y1="126.0" x2="238.7" y2="160.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="414.8" y1="126.0" x2="481.3" y2="160.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/></svg>