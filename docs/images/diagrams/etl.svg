<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 160" role="img" aria-label="ETL: how a batch of data enters the warehouse"><title>ETL: how a batch of data enters the warehouse</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--d-mute,#63635e)"/></marker></defs><rect x="8" y="30" width="120" height="60" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="68.0" y="57.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Clean CSV</text><text x="68.0" y="74.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">notebook 01</text><rect x="151" y="30" width="120" height="60" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="211.0" y="57.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Staging</text><text x="211.0" y="74.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">COPY command</text><rect x="294" y="30" width="120" height="60" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="354.0" y="57.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Dimensions</text><text x="354.0" y="74.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">add new places</text><rect x="437" y="30" width="120" height="60" rx="8" style="fill:var(--d-tint,#eaf0fd);stroke:var(--d-acc,#2f5bd3);stroke-width:1.4"/><text x="497.0" y="57.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Fact rows</text><text x="497.0" y="74.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">look up the keys</text><rect x="580" y="30" width="120" height="60" rx="8" style="fill:var(--d-tint2,#e6f4ec);stroke:var(--d-acc2,#1f8a5b);stroke-width:1.4"/><text x="640.0" y="57.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">5 checks</text><text x="640.0" y="74.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">all must be 0</text><line x1="128.0" y1="60.0" x2="151.0" y2="60.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="271.0" y1="60.0" x2="294.0" y2="60.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="414.0" y1="60.0" x2="437.0" y2="60.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="557.0" y1="60.0" x2="580.0" y2="60.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><text x="8" y="122" text-anchor="start" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">Dimensions + fact rows are filled by one SQL procedure, dw.load_batch.</text><text x="8" y="140" text-anchor="start" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">It runs once for Jan 2022 - Nov 2025 (initial load), then again for Dec 2025 (incremental load).</text></svg>