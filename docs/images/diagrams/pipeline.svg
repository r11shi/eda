<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-label="The whole project: where the data goes"><title>The whole project: where the data goes</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--d-mute,#63635e)"/></marker></defs><rect x="10" y="20" width="120" height="56" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="70.0" y="45.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Raw CSV</text><text x="70.0" y="62.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">73,630 rows</text><rect x="160" y="20" width="130" height="56" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="225.0" y="45.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Clean (Python)</text><text x="225.0" y="62.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">notebook 01</text><rect x="320" y="20" width="120" height="56" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="380.0" y="45.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Staging table</text><text x="380.0" y="62.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">waiting room</text><rect x="470" y="14" width="240" height="68" rx="8" style="fill:var(--d-tint,#eaf0fd);stroke:var(--d-acc,#2f5bd3);stroke-width:1.4"/><text x="590.0" y="45.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Batch warehouse</text><text x="590.0" y="62.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">PostgreSQL · star schema</text><rect x="360" y="150" width="110" height="56" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="415.0" y="175.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">SQL &amp; OLAP</text><text x="415.0" y="192.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">10 questions</text><rect x="485" y="150" width="105" height="56" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="537.5" y="175.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Dashboard</text><text x="537.5" y="192.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">HTML page</text><rect x="605" y="150" width="105" height="56" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="657.5" y="175.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">3 models</text><text x="657.5" y="192.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">notebooks 07-09</text><rect x="470" y="262" width="240" height="56" rx="8" style="fill:var(--d-tint2,#e6f4ec);stroke:var(--d-acc2,#1f8a5b);stroke-width:1.4"/><text x="590.0" y="287.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Distributed copy</text><text x="590.0" y="304.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">Citus · 3 nodes</text><rect x="10" y="262" width="420" height="56" rx="8" style="fill:var(--d-tint3,#fbeae4);stroke:var(--d-warm,#c2542d);stroke-width:1.4"/><text x="220.0" y="287.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Real-time copy: Kafka → Spark → ClickHouse → Grafana</text><text x="220.0" y="304.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">past inspections replayed as live events</text><line x1="130.0" y1="48.0" x2="160.0" y2="48.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="290.0" y1="48.0" x2="320.0" y2="48.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="440.0" y1="48.0" x2="470.0" y2="48.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="544.2" y1="82.0" x2="452.7" y2="150.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="576.3" y1="82.0" x2="548.8" y2="150.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="607.7" y1="82.0" x2="643.0" y2="150.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="590.0" y1="82.0" x2="590.0" y2="262.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6;stroke-dasharray:5 4"/><line x1="224.4" y1="76.0" x2="220.6" y2="262.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6;stroke-dasharray:5 4"/><text x="10" y="342" text-anchor="start" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">blue = the main warehouse · dashed = the same data copied into the other two warehouses</text></svg>