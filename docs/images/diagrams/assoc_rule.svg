<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" role="img" aria-label="Support, confidence and lift for one rule"><title>Support, confidence and lift for one rule</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--d-mute,#63635e)"/></marker></defs><rect x="10" y="40" width="210" height="64" rx="8" style="fill:var(--d-tint,#eaf0fd);stroke:var(--d-acc,#2f5bd3);stroke-width:1.4"/><text x="115.0" y="69.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">IF  10+ violations</text><text x="115.0" y="86.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">5.4% of inspections have both parts</text><rect x="300" y="40" width="160" height="64" rx="8" style="fill:var(--d-tint3,#fbeae4);stroke:var(--d-warm,#c2542d);stroke-width:1.4"/><text x="380.0" y="76.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">THEN  Fail</text><line x1="220.0" y1="72.0" x2="300.0" y2="72.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><rect x="520" y="14" width="190" height="116" rx="8" style="fill:var(--d-tint2,#e6f4ec);stroke:var(--d-acc2,#1f8a5b);stroke-width:1.4"/><text x="615.0" y="48.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Support 5.4%</text><text x="615.0" y="65.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">Confidence 69%</text><text x="615.0" y="79.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">(fails, when 10+ violations)</text><text x="615.0" y="93.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">Lift 3.0</text><text x="615.0" y="107.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">(3× the normal 23%)</text></svg>