<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-label="How many rows survive cleaning"><title>How many rows survive cleaning</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--d-mute,#63635e)"/></marker></defs><text x="10" y="30" text-anchor="start" style="fill:var(--d-ink,#21201c);font:500 12.5px Inter,system-ui,sans-serif">Raw rows from the city</text><rect x="10" y="38" width="600.0" height="22" rx="3" style="fill:var(--d-line,#c9c8c2)"/><text x="618.0" y="54" text-anchor="start" style="fill:var(--d-ink,#21201c);font:600 12.5px Inter,system-ui,sans-serif">73,630</text><text x="10" y="86" text-anchor="start" style="fill:var(--d-ink,#21201c);font:500 12.5px Inter,system-ui,sans-serif">After removing 29 repeated reports</text><rect x="10" y="94" width="599.7636832812713" height="22" rx="3" style="fill:var(--d-line,#c9c8c2)"/><text x="617.7636832812713" y="110" text-anchor="start" style="fill:var(--d-ink,#21201c);font:600 12.5px Inter,system-ui,sans-serif">73,601</text><text x="10" y="142" text-anchor="start" style="fill:var(--d-ink,#21201c);font:500 12.5px Inter,system-ui,sans-serif">Completed inspections (the facts)</text><rect x="10" y="150" width="503.08569876409075" height="22" rx="3" style="fill:var(--d-acc,#2f5bd3)"/><text x="521.0856987640907" y="166" text-anchor="start" style="fill:var(--d-ink,#21201c);font:600 12.5px Inter,system-ui,sans-serif">61,737</text><text x="10" y="184" text-anchor="start" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">11,864 rows were visits that never happened (Out of Business, No Entry …): kept in staging, not counted.</text></svg>