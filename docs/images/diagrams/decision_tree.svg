<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="The decision tree asks yes/no questions"><title>The decision tree asks yes/no questions</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--d-mute,#63635e)"/></marker></defs><rect x="245" y="10" width="230" height="50" rx="8" style="fill:var(--d-tint,#eaf0fd);stroke:var(--d-acc,#2f5bd3);stroke-width:1.4"/><text x="360.0" y="39.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Previous result = Fail?</text><rect x="40" y="100" width="230" height="50" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="155.0" y="129.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Complaint inspection?</text><rect x="450" y="100" width="230" height="50" rx="8" style="fill:var(--d-tint2,#e6f4ec);stroke:var(--d-acc2,#1f8a5b);stroke-width:1.4"/><text x="565.0" y="122.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Quick re-check after a fail</text><text x="565.0" y="139.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">only 4-5% fail</text><rect x="10" y="190" width="230" height="52" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="125.0" y="213.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Previous violations &gt; 6?</text><text x="125.0" y="230.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">and a long gap since last visit</text><rect x="290" y="190" width="180" height="52" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="380.0" y="213.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Not a complaint</text><text x="380.0" y="230.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">lower chance of fail</text><rect x="10" y="272" width="230" height="52" rx="8" style="fill:var(--d-tint3,#fbeae4);stroke:var(--d-warm,#c2542d);stroke-width:1.4"/><text x="125.0" y="295.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Highest risk group</text><text x="125.0" y="312.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">55-58% fail</text><line x1="303.1" y1="60.0" x2="211.9" y2="100.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><text x="257.5" y="74.0" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:500 11px Inter,system-ui,sans-serif">no</text><line x1="416.9" y1="60.0" x2="508.1" y2="100.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><text x="462.5" y="74.0" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:500 11px Inter,system-ui,sans-serif">yes</text><line x1="146.8" y1="150.0" x2="133.6" y2="190.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><text x="140.2" y="164.0" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:500 11px Inter,system-ui,sans-serif">yes</text><line x1="216.8" y1="150.0" x2="315.7" y2="190.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><text x="266.3" y="164.0" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:500 11px Inter,system-ui,sans-serif">no</text><line x1="125.0" y1="242.0" x2="125.0" y2="272.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><text x="125.0" y="251.0" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:500 11px Inter,system-ui,sans-serif">yes</text></svg>