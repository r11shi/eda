<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Real-time pipeline (replay of past inspections)"><title>Real-time pipeline (replay of past inspections)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--d-mute,#63635e)"/></marker></defs><rect x="8" y="60" width="120" height="60" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="68.0" y="87.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">producer.py</text><text x="68.0" y="104.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">80 events/s</text><rect x="158" y="60" width="110" height="60" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="213.0" y="87.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Kafka</text><text x="213.0" y="104.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">message queue</text><rect x="298" y="60" width="130" height="60" rx="8" style="fill:var(--d-tint,#eaf0fd);stroke:var(--d-acc,#2f5bd3);stroke-width:1.4"/><text x="363.0" y="87.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Spark</text><text x="363.0" y="104.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">checks each event</text><rect x="460" y="20" width="120" height="52" rx="8" style="fill:var(--d-tint2,#e6f4ec);stroke:var(--d-acc2,#1f8a5b);stroke-width:1.4"/><text x="520.0" y="43.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">ClickHouse</text><text x="520.0" y="60.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">3,647 good events</text><rect x="460" y="112" width="120" height="52" rx="8" style="fill:var(--d-tint3,#fbeae4);stroke:var(--d-warm,#c2542d);stroke-width:1.4"/><text x="520.0" y="135.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">invalid_events</text><text x="520.0" y="152.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">24 broken caught</text><rect x="606" y="20" width="106" height="52" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="659.0" y="43.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Grafana</text><text x="659.0" y="60.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">every 5 s</text><line x1="128.0" y1="90.0" x2="158.0" y2="90.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="268.0" y1="90.0" x2="298.0" y2="90.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><line x1="428.0" y1="71.8" x2="460.0" y2="62.8" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><text x="444.0" y="61.3" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:500 11px Inter,system-ui,sans-serif">valid</text><line x1="428.0" y1="109.9" x2="460.0" y2="119.7" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><text x="444.0" y="108.8" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:500 11px Inter,system-ui,sans-serif">broken</text><line x1="580.0" y1="46.0" x2="606.0" y2="46.0" marker-end="url(#ah)" style="stroke:var(--d-mute,#63635e);stroke-width:1.6"/><text x="8" y="190" text-anchor="start" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">About 1.8 seconds from sending an event to seeing it on the Grafana dashboard.</text></svg>