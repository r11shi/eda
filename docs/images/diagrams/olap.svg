<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="OLAP: looking at the same numbers at different levels"><title>OLAP: looking at the same numbers at different levels</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--d-mute,#63635e)"/></marker></defs><rect x="20" y="20" width="120" height="46" rx="8" style="fill:var(--d-tint,#eaf0fd);stroke:var(--d-acc,#2f5bd3);stroke-width:1.4"/><text x="80.0" y="47.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Year</text><rect x="20" y="80" width="120" height="46" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="80.0" y="107.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Quarter</text><rect x="20" y="140" width="120" height="46" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="80.0" y="167.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Month</text><line x1="80.0" y1="140.0" x2="80.0" y2="126.0" marker-end="url(#ah)" style="stroke:var(--d-acc,#2f5bd3);stroke-width:1.6"/><line x1="80.0" y1="80.0" x2="80.0" y2="66.0" marker-end="url(#ah)" style="stroke:var(--d-acc,#2f5bd3);stroke-width:1.6"/><text x="150" y="112" text-anchor="start" style="fill:var(--d-acc,#2f5bd3);font:600 11.5px Inter,system-ui,sans-serif">roll-up ↑</text><text x="150" y="132" text-anchor="start" style="fill:var(--d-acc,#2f5bd3);font:600 11.5px Inter,system-ui,sans-serif">drill-down ↓</text><rect x="220" y="20" width="220" height="50" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="330.0" y="42.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Slice</text><text x="330.0" y="59.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">keep one value: year = 2025</text><rect x="220" y="80" width="220" height="50" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="330.0" y="102.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Dice</text><text x="330.0" y="119.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">2025 AND high risk</text><rect x="220" y="140" width="220" height="50" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="330.0" y="162.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Pivot</text><text x="330.0" y="179.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">results become columns</text><rect x="500" y="20" width="200" height="50" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="600.0" y="42.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">Drill-down</text><text x="600.0" y="59.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">group → type → one shop</text><rect x="500" y="80" width="200" height="50" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="600.0" y="102.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">CUBE</text><text x="600.0" y="119.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">all subtotals at once</text><rect x="500" y="140" width="200" height="50" rx="8" style="fill:var(--d-box,#ffffff);stroke:var(--d-line,#c9c8c2);stroke-width:1.4"/><text x="600.0" y="162.5" text-anchor="middle" style="fill:var(--d-ink,#21201c);font:600 13px Inter,system-ui,sans-serif">GROUPING SETS</text><text x="600.0" y="179.5" text-anchor="middle" style="fill:var(--d-mute,#63635e);font:400 11.5px Inter,system-ui,sans-serif">only the subtotals you pick</text></svg>